<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#C1583B" />
  <meta name="description" content="FabricAtHome — choose fabric at home. A verified showroom rep arrives within ~30 min with the full curtain & sofa-fabric catalog." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>FabricAtHome</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="appbar">
    <div class="appbar-inner">
      <button class="appbar-back" id="backBtn" aria-label="Back" hidden>&larr;</button>
      <div class="brand">
        <span class="brand-mark"></span>
        <h1>FabricAtHome</h1>
      </div>
      <span class="promise-pill">~30 min</span>
    </div>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar">
    <button class="tab" id="tab-home">Home</button>
    <button class="tab" id="tab-work">Orders</button>
    <button class="tab" id="tab-about">About</button>
  </nav>

  <div id="toast" class="toast" hidden></div>

  <script>
    // Optional backend switch (Supabase). Leave as-is for local mock mode.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>
  <script>window.FH_BACKEND = window.FH_BACKEND || { enabled: false };</script>
  <script src="js/data.js"></script>
  <script src="js/provider.js"></script>
  <script src="js/store.js"></script>
  <script src="js/geo.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
