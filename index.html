<!DOCTYPE html>
<html lang="en-in" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#C1583B" />
  <meta name="description" content="FabricAtHome — choose curtain & sofa fabric at home. A verified showroom rep arrives within ~30 min with the full catalog. Clear installation charges, no hidden fees." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="FabricAtHome" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>FabricAtHome</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <a class="skip-link" href="#view">Skip to main content</a>
  <header class="appbar">
    <div class="appbar-inner">
      <button class="appbar-back" id="backBtn" aria-label="Back" hidden>&larr;</button>
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <h1 aria-label="FabricAtHome app title">FabricAtHome</h1>
      </div>
      <span class="promise-pill">~30 min</span>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Primary">
    <button class="tab" id="tab-home">Home</button>
    <button class="tab" id="tab-work">Orders</button>
    <button class="tab" id="tab-about">About</button>
  </nav>

  <div class="install-bar" id="install-bar" hidden>
    <span>Install FabricAtHome for one-tap fabric visits.</span>
    <button class="btn tiny terracotta" id="install-btn" type="button" aria-disabled="true">Install</button>
    <button class="install-dismiss" id="install-dismiss" type="button" aria-label="Dismiss install prompt">×</button>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script>
    window.FH_BACKEND = window.FH_BACKEND || { enabled: false };
    // PWA install: stash beforeinstallprompt, expose via accessible button.
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      window.__installPrompt = e;
      const bar = document.getElementById("install-bar");
      const btn = document.getElementById("install-btn");
      if (bar) bar.hidden = false;
      if (btn) btn.setAttribute("aria-disabled", "false");
    });
    document.addEventListener("DOMContentLoaded", () => {
      const bar = document.getElementById("install-bar");
      const btn = document.getElementById("install-btn");
      const dismiss = document.getElementById("install-dismiss");
      const announce = document.getElementById("toast");
      if (btn) btn.addEventListener("click", async () => {
        const p = window.__installPrompt;
        if (!p) return;
        try {
          const choice = await p.prompt();
          if (bar) bar.hidden = true;
          if (announce) {
            announce.textContent = choice.outcome === "accepted" ? "Installed — check your home screen." : "Install dismissed.";
            announce.hidden = false;
            setTimeout(() => { announce.hidden = true; }, 3000);
          }
        } catch (e) {}
      });
      if (dismiss) dismiss.addEventListener("click", () => { if (bar) bar.hidden = true; });
    });
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>
  <script src="js/data.js"></script>
  <script src="js/provider.js"></script>
  <script src="js/store.js"></script>
  <script src="js/geo.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
