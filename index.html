<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F6F4EF" />
  <title>FabricAtHome</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="appbar">
    <div class="appbar-inner">
      <button class="appbar-back" id="backBtn" aria-label="Back" hidden>&larr;</button>
      <div class="brand">
        <span class="brand-mark"></span>
        <h1>FabricAtHome</h1>
      </div>
      <span class="promise-pill">~30 min</span>
    </div>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar">
    <button class="tab" data-tab="home" id="tab-home">Home</button>
    <button class="tab" data-tab="orders" id="tab-orders">Orders</button>
  </nav>

  <div id="toast" class="toast" hidden></div>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
